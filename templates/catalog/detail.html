{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<article class="detail">
    {% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}">
    {% endif %}
    <h1>{{ product.name }}</h1>
    <p class="price">{{ product.price }} $.</p>
    <p>{{ product.description }}</p>
    <a href="{% url 'catalog' %}">← Назад в каталог</a>
</article>
{% endblock %}
